<!DOCTYPE html>
<html>
<head>
    <title>PagePulse URL Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>PagePulse URL Checker</h2>

    <input
            type="text"
            id="url"
            placeholder="Enter website URL"
    >

    <br>

    <button onclick="checkURL()">
        Check
    </button>

    <div id="result"></div>
    <h3>Recent Checks</h3>
    <ul id="history"></ul>
    <button onclick="clearHistory()">Clear History</button>

</div>


<script src="script.js"></script>

<footer>
    <p>
        Built for <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Training Task</a>
    </p>
</footer>

</body>
</html>
